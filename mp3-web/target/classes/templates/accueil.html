<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Accueil')}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-12 text-center py-5">
            <h1 class="display-4 text-primary fw-bold"><i class="bi bi-music-player"></i> Système de Gestion MP3</h1>
            <p class="lead text-muted">Application couplée avec le processus desktop RabbitMQ</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <!-- Carte Chansons -->
        <div class="col-md-5">
            <div class="card h-100">
                <div class="card-body text-center py-5">
                    <i class="bi bi-music-note-beamed text-primary" style="font-size: 4rem;"></i>
                    <h2 class="card-title mt-3">Base de Chansons</h2>
                    <p class="card-text text-muted">Aimentée automatiquement par le programme desktop</p>
                    <h3 class="display-5 text-dark fw-bold mb-4" th:text="${totalChansons}">0</h3>
                    <a th:href="@{/chansons}" class="btn btn-primary btn-lg w-100"><i class="bi bi-list-ul"></i> Voir les chansons</a>
                </div>
            </div>
        </div>

        <!-- Carte Playlists -->
        <div class="col-md-5">
            <div class="card h-100">
                <div class="card-body text-center py-5">
                    <i class="bi bi-collection-play text-success" style="font-size: 4rem;"></i>
                    <h2 class="card-title mt-3">Playlists</h2>
                    <p class="card-text text-muted">Générez et téléchargez des listes de lecture personnalisées</p>
                    <h3 class="display-5 text-dark fw-bold mb-4" th:text="${totalPlaylists}">0</h3>
                    <a th:href="@{/playlists/generer}" class="btn btn-success btn-lg w-100 mb-2"><i class="bi bi-magic"></i> Générer une playlist</a>
                    <a th:href="@{/playlists}" class="btn btn-outline-success w-100">Gérer les playlists</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
